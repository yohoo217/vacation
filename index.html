<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>旅行計畫入口</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1e2a32;
      --muted: #68747d;
      --paper: #f4f1ea;
      --surface: #fffdf8;
      --line: #d7d0c2;
      --green: #1f6b55;
      --blue: #2f6f8f;
      --red: #b84a3a;
      --shadow: 0 14px 32px rgba(39, 45, 49, 0.12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", sans-serif;
      line-height: 1.55;
    }
    .shell {
      width: min(980px, calc(100% - 28px));
      margin: 0 auto;
      padding: 34px 0;
    }
    header {
      min-height: 280px;
      display: grid;
      align-items: end;
      color: white;
      background:
        linear-gradient(90deg, rgba(26, 47, 40, 0.96), rgba(26, 47, 40, 0.7)),
        url("_整理備份_20260505/朝聖之路/camino_cover.png") center/cover;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 6vw, 4rem);
      line-height: 1;
      letter-spacing: 0;
    }
    .lead {
      max-width: 700px;
      margin: 14px 0 0;
      color: rgba(255,255,255,0.86);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-top: 22px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .card h2 {
      margin: 0;
      font-size: 1.35rem;
    }
    .card p {
      color: var(--muted);
      min-height: 72px;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    a {
      display: inline-flex;
      align-items: center;
      min-height: 40px;
      border-radius: 8px;
      padding: 9px 12px;
      text-decoration: none;
      border: 1px solid var(--line);
      color: var(--ink);
      font-weight: 900;
      background: #fff;
    }
    a.primary {
      color: #fff;
      border-color: var(--green);
      background: var(--green);
    }
    a.blue {
      color: #fff;
      border-color: var(--blue);
      background: var(--blue);
    }
    a.red {
      color: #fff;
      border-color: var(--red);
      background: var(--red);
    }
    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .card p { min-height: 0; }
    }
  </style>
</head>
<body>
  <header>
    <div class="shell">
      <h1>旅行計畫入口</h1>
      <p class="lead">Camino 主導覽、住宿地圖、輪播頁與簡報版。Barcelona / Scotland / London 後續行程已整合在主導覽與簡報版，不再另外分散成獨立頁或表格檔。</p>
    </div>
  </header>
  <main class="shell">
    <section class="grid">
      <article class="card">
        <h2>Camino 葡萄牙朝聖之路</h2>
        <p>目前行程、每日住宿、進度、船班、補給、Santiago 兩晚，以及後續 Barcelona → Edinburgh → London 安排。</p>
        <div class="links">
          <a class="primary" href="_整理備份_20260505/朝聖之路/camino-guide.html">主導覽頁</a>
          <a href="_整理備份_20260505/朝聖之路/camino-stay-map.html">住宿地圖</a>
          <a href="_整理備份_20260505/朝聖之路/camino-journey-carousel.html">輪播頁</a>
          <a href="_整理備份_20260505/朝聖之路/葡萄牙朝聖之路簡報.html">簡報版</a>
        </div>
      </article>
      <article class="card">
        <h2>後續城市段</h2>
        <p>Santiago 兩晚後，Barcelona 兩天，接著 Edinburgh / Scotland 四晚，最後前往 London。內容放在主導覽頁與簡報版內。</p>
        <div class="links">
          <a class="blue" href="_整理備份_20260505/朝聖之路/camino-guide.html">看主導覽</a>
          <a href="_整理備份_20260505/朝聖之路/葡萄牙朝聖之路簡報.html">看簡報版</a>
        </div>
      </article>
    </section>
  </main>
</body>
</html>
